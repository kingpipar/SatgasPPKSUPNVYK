<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="16" fill="#F4F8F6"/>
  
  <!-- Title in SVG -->
  <text x="500" y="48" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#3C745E" text-anchor="middle" letter-spacing="0.5">BAGAN ALUR STANDAR OPERASIONAL PROSEDUR (SOP) PENANGANAN LAPORAN</text>
  <text x="500" y="74" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Satgas PPKS UPN "Veteran" Yogyakarta — Cepat, Rahasia, dan Berpihak pada Korban</text>

  <!-- Step Connector Lines -->
  <line x1="180" y1="210" x2="330" y2="210" stroke="#3C745E" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="360" y1="210" x2="510" y2="210" stroke="#3C745E" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="540" y1="210" x2="690" y2="210" stroke="#3C745E" stroke-width="4" stroke-dasharray="6 4"/>
  <line x1="720" y1="210" x2="870" y2="210" stroke="#3C745E" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Step 1 Card -->
  <g transform="translate(30, 110)">
    <rect width="170" height="260" rx="12" fill="url(#bgBox)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="85" cy="45" r="24" fill="#3C745E"/>
    <text x="85" y="53" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">01</text>
    <text x="85" y="105" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#1D3B30" text-anchor="middle">Penerimaan Aduan</text>
    <text x="85" y="130" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      <tspan x="85" dy="0">Laporan masuk via</tspan>
      <tspan x="85" dy="16">Google Form resmi,</tspan>
      <tspan x="85" dy="16">Hotline Satgas,</tspan>
      <tspan x="85" dy="16">atau tatap muka</tspan>
      <tspan x="85" dy="16">di Sekretariat PPKS.</tspan>
    </text>
    <rect x="25" y="222" width="120" height="24" rx="12" fill="#EBF4F0"/>
    <text x="85" y="238" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#3C745E" text-anchor="middle">Layanan 24 Jam</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(225, 110)">
    <rect width="170" height="260" rx="12" fill="url(#bgBox)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="85" cy="45" r="24" fill="#3C745E"/>
    <text x="85" y="53" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">02</text>
    <text x="85" y="105" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#1D3B30" text-anchor="middle">Verifikasi & Asesmen</text>
    <text x="85" y="130" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      <tspan x="85" dy="0">Verifikasi berkas awal,</tspan>
      <tspan x="85" dy="16">asesmen kerentanan</tspan>
      <tspan x="85" dy="16">korban, serta validasi</tspan>
      <tspan x="85" dy="16">kebutuhan mendesak</tspan>
      <tspan x="85" dy="16">(psikis/medis/keamanan).</tspan>
    </text>
    <rect x="25" y="222" width="120" height="24" rx="12" fill="#EBF4F0"/>
    <text x="85" y="238" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#3C745E" text-anchor="middle">Maks. 3x24 Jam</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(420, 110)">
    <rect width="170" height="260" rx="12" fill="url(#bgBox)" stroke="#3C745E" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="85" cy="45" r="24" fill="#D9534F"/>
    <text x="85" y="53" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">03</text>
    <text x="85" y="105" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#1D3B30" text-anchor="middle">Pendampingan</text>
    <text x="85" y="130" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      <tspan x="85" dy="0">Pemberian konseling</tspan>
      <tspan x="85" dy="16">psikologis, proteksi</tspan>
      <tspan x="85" dy="16">akademik bebas intimidasi,</tspan>
      <tspan x="85" dy="16">dan pendampingan</tspan>
      <tspan x="85" dy="16">bantuan hukum.</tspan>
    </text>
    <rect x="25" y="222" width="120" height="24" rx="12" fill="#FEE2E2"/>
    <text x="85" y="238" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle">Prioritas Korban</text>
  </g>

  <!-- Step 4 Card -->
  <g transform="translate(615, 110)">
    <rect width="170" height="260" rx="12" fill="url(#bgBox)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="85" cy="45" r="24" fill="#3C745E"/>
    <text x="85" y="53" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">04</text>
    <text x="85" y="105" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#1D3B30" text-anchor="middle">Pemeriksaan</text>
    <text x="85" y="130" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      <tspan x="85" dy="0">Investigasi faktual,</tspan>
      <tspan x="85" dy="16">pengumpulan bukti,</tspan>
      <tspan x="85" dy="16">klarifikasi pihak terkait</tspan>
      <tspan x="85" dy="16">dalam ruangan khusus</tspan>
      <tspan x="85" dy="16">tanpa konfrontasi.</tspan>
    </text>
    <rect x="25" y="222" width="120" height="24" rx="12" fill="#EBF4F0"/>
    <text x="85" y="238" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#3C745E" text-anchor="middle">Investigasi Objektif</text>
  </g>

  <!-- Step 5 Card -->
  <g transform="translate(805, 110)">
    <rect width="170" height="260" rx="12" fill="url(#bgBox)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="85" cy="45" r="24" fill="#3C745E"/>
    <text x="85" y="53" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">05</text>
    <text x="85" y="105" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#1D3B30" text-anchor="middle">Sanksi & Pemulihan</text>
    <text x="85" y="130" font-family="'Inter', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      <tspan x="85" dy="0">Penyusunan simpulan</tspan>
      <tspan x="85" dy="16">&amp; rekomendasi sanksi</tspan>
      <tspan x="85" dy="16">ke Rektor UPNVY,</tspan>
      <tspan x="85" dy="16">disertai jaminan</tspan>
      <tspan x="85" dy="16">pemulihan korban.</tspan>
    </text>
    <rect x="25" y="222" width="120" height="24" rx="12" fill="#EBF4F0"/>
    <text x="85" y="238" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#3C745E" text-anchor="middle">Keputusan Rektor</text>
  </g>
</svg>
